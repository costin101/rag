name: nomad-spike

# Throwaway (issue #8, PR 0): records real Nomad API responses as fixtures for tests/fake_nomad.py.
on:
  push:
    branches: [feature/8-nomad-spike]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      NOMAD_VERSION: "2.0.7"
      # SHA256 of nomad_2.0.7_linux_amd64.zip from releases.hashicorp.com/nomad/2.0.7/nomad_2.0.7_SHA256SUMS.
      NOMAD_SHA256: 4c9b8a0850d6fd9caadbbab09b3e6fdf8b77aa777729543c70c61b85acca68c1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and push the spike image
        run: |
          docker build -t 127.0.0.1:5000/spike:1 spike
          docker push 127.0.0.1:5000/spike:1
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' 127.0.0.1:5000/spike:1)
          echo "SPIKE_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Install Nomad
        run: |
          curl -sSfLO "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
          echo "${NOMAD_SHA256}  nomad_${NOMAD_VERSION}_linux_amd64.zip" | sha256sum -c -
          unzip -o "nomad_${NOMAD_VERSION}_linux_amd64.zip" nomad
          sudo install -m 0755 nomad /usr/local/bin/nomad
          nomad version
      - name: Start the dev agent
        run: |
          sudo nohup nomad agent -dev -bind=127.0.0.1 > nomad-agent.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4646/v1/nodes | grep -q '"Status":"ready"' && break
            sleep 2
          done
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4646/v1/nodes | python3 -c "
          import json, sys
          nodes = json.load(sys.stdin)
          sys.exit(0 if nodes and nodes[0]['Drivers']['docker']['Healthy'] else 1)" && exit 0
            sleep 2
          done
          echo "docker driver not healthy" >&2
          exit 1
      - name: Record responses
        run: python3 spike/record.py spike-out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nomad-spike
          path: |
            spike-out
            nomad-agent.log
